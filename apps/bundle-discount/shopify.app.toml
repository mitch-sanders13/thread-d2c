# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

name = "Thread Bundle Discount"
application_url = "https://shopify.dev/apps/default-app-home"
embedded = true
client_id = "64d029ed1899d9ffe706446110c642a7"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "write_discounts,read_products"

[auth]
redirect_urls = [ "https://shopify.dev/apps/default-app-home/api/auth" ]

[discount.metafields.app.function-configuration]
type = "json"
name = "Bundle discount function configuration"
description = "Optional JSON: percent, edcSlots, toteSize, edcMessage, toteMessage"

  [discount.metafields.app.function-configuration.access]
  admin = "merchant_read_write"
  storefront = "none"

[webhooks]
api_version = "2026-10"

[build]
automatically_update_urls_on_dev = true
